var STORAGE_KEY = "mwt_monthly_tracker_v1";
var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function loadData() {
  try { var raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { chains: [], extraWork: [], currentMonth: getCurrentMonthKey() };
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function uid() { return "id_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6); }

function getCurrentMonthKey() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function getMonthLabel(key) {
  var parts = key.split("-");
  return MONTH_NAMES[parseInt(parts[1], 10) - 1] + " " + parts[0];
}

function todayStr() {
  var d = new Date();
  return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + d.getFullYear();
}

// ─── Federal Holidays (US) ───
function getFederalHolidays(year) {
  var holidays = [];
  // New Year's Day - Jan 1
  holidays.push(new Date(year, 0, 1).getTime());
  // Memorial Day - Last Monday of May
  var memDay = new Date(year, 4, 31);
  while (memDay.getDay() !== 1) memDay.setDate(memDay.getDate() - 1);
  holidays.push(memDay.getTime());
  // July 4th
  holidays.push(new Date(year, 6, 4).getTime());
  // Labor Day - First Monday of September
  var labDay = new Date(year, 8, 1);
  while (labDay.getDay() !== 1) labDay.setDate(labDay.getDate() + 1);
  holidays.push(labDay.getTime());
  // Thanksgiving - 4th Thursday of November
  var tg = new Date(year, 10, 1);
  var count = 0;
  while (count < 4) { if (tg.getDay() === 4) count++; if (count < 4) tg.setDate(tg.getDate() + 1); }
  holidays.push(tg.getTime());
  // Black Friday - day after Thanksgiving
  var bf = new Date(tg.getTime());
  bf.setDate(bf.getDate() + 1);
  holidays.push(bf.getTime());
  // Christmas - Dec 25
  holidays.push(new Date(year, 11, 25).getTime());
  return holidays;
}

function isHoliday(date, holidays) {
  var t = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  for (var i = 0; i < holidays.length; i++) {
    if (holidays[i] === t) return true;
  }
  return false;
}

function getRemainingWorkdays() {
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var lastDay = new Date(year, month + 1, 0).getDate();
  var today = now.getDate();
  var holidays = getFederalHolidays(year);
  var count = 0;
  for (var d = today; d <= lastDay; d++) {
    var dt = new Date(year, month, d);
    var dow = dt.getDay();
    if (dow >= 1 && dow <= 5 && !isHoliday(dt, holidays)) {
      count++;
    }
  }
  return count;
}

function getTotalWorkdaysInMonth() {
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var lastDay = new Date(year, month + 1, 0).getDate();
  var holidays = getFederalHolidays(year);
  var count = 0;
  for (var d = 1; d <= lastDay; d++) {
    var dt = new Date(year, month, d);
    var dow = dt.getDay();
    if (dow >= 1 && dow <= 5 && !isHoliday(dt, holidays)) count++;
  }
  return count;
}

// ─── Export helper ───
function downloadJSON(data, filename) {
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function exportFilename(label) {
  var d = new Date();
  var safe = label.replace(/[^a-zA-Z0-9]/g, "_").replace(/_+/g, "_");
  return "MWT_Monthly_" + safe + "_" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
}

  var _activeStore = useState(null);

  var _chainName = useState("");

  var _storeName = useState("");
  var storeName = _storeName[0]; var setStoreName = _storeName[1];

  var _ewDesc = useState("");
  var ewDesc = _ewDesc[0]; var setEwDesc = _ewDesc[1];

  var _toast = useState("");
  var toast = _toast[0]; var setToast = _toast[1];

  var _modal = useState(null);
  var modal = _modal[0]; var setModal = _modal[1];

  var _search = useState("");
  var search = _search[0]; var setSearch = _search[1];

  var toastRef = useRef(null);
  var fileInputRef = useRef(null);

  function showToast(msg) {
    setToast(msg);
    if (toastRef.current) clearTimeout(toastRef.current);
    toastRef.current = setTimeout(function() { setToast(""); }, 2500);
  }

  useEffect(function() {
    saveData({ chains: chains, extraWork: extraWork, currentMonth: currentMK });
  }, [chains, extraWork]);

  // ─── Counters ───
  function totalStoreCount() {
    var n = 0;
    for (var i = 0; i < chains.length; i++) n += chains[i].stores.length;
    return n;
  }

  function doneStoreCount() {
    var n = 0;
    for (var i = 0; i < chains.length; i++) {
      for (var j = 0; j < chains[i].stores.length; j++) { if (chains[i].stores[j].done) n++; }
    }
    return n;
  }

  function chainDoneCount(chain) {
    var n = 0;
    for (var i = 0; i < chain.stores.length; i++) { if (chain.stores[i].done) n++; }
    return n;
  }

  function findChain(id) {
    for (var i = 0; i < chains.length; i++) { if (chains[i].id === id) return chains[i]; }
    return null;
  }

  function findStore(chainId, storeId) {
    var c = findChain(chainId);
    if (!c) return null;
    for (var i = 0; i < c.stores.length; i++) { if (c.stores[i].id === storeId) return c.stores[i]; }
    return null;
  }

  // ─── Progress stats ───
  function getProgressStats() {
    var total = totalStoreCount();
    var done = doneStoreCount();
    var remaining = total - done;
    var workdays = getRemainingWorkdays();
    var perDay = workdays > 0 ? Math.ceil(remaining / workdays) : remaining;
    var pct = total > 0 ? Math.round((done / total) * 100) : 0;
    return { total: total, done: done, remaining: remaining, workdays: workdays, perDay: perDay, pct: pct };
  }

  // ═══ CRUD ═══
  function handleAddChain() {
    if (!chainName.trim()) return;
    setChains(function(prev) { return prev.concat([{ id: uid(), name: chainName.trim(), stores: [] }]); });
    setChainName(""); showToast("Chain added"); setView("dashboard");
  }

  function handleDeleteChain(chainId) {
    setChains(function(prev) { return prev.filter(function(c) { return c.id !== chainId; }); });
    setModal(null); setActiveChain(null); setView("dashboard"); showToast("Chain deleted");
  }

  function handleAddStore() {
    if (!storeName.trim() || !activeChain) return;
    var ns = { id: uid(), name: storeName.trim(), done: false, doneDate: null, history: [] };
    setChains(function(prev) {
      return prev.map(function(c) {
        return c.id === activeChain.id ? Object.assign({}, c, { stores: c.stores.concat([ns]) }) : c;
      });
    });
    setStoreName(""); showToast("Store added"); setView("chain");
  }

  function handleDeleteStore(storeId) {
    setChains(function(prev) {
      return prev.map(function(c) {
        if (c.id === activeChain.id) return Object.assign({}, c, { stores: c.stores.filter(function(s) { return s.id !== storeId; }) });
        return c;
      });
    });
    setModal(null); setActiveStore(null); setView("chain"); showToast("Store removed");
  }

  function toggleStore(chainId, storeId) {
    setChains(function(prev) {
      return prev.map(function(c) {
        if (c.id === chainId) {
          return Object.assign({}, c, {
            stores: c.stores.map(function(s) {
              if (s.id === storeId) {
                var nowDone = !s.done;
                return Object.assign({}, s, { done: nowDone, doneDate: nowDone ? todayStr() : null });
              }
              return s;
            })
          });
        }
        return c;
      });
    });
  }

  // Extra work
  function handleAddExtraWork() {
    if (!ewDesc.trim()) return;
    setExtraWork(function(prev) { return prev.concat([{ id: uid(), description: ewDesc.trim(), done: false, addedAt: todayStr() }]); });
    setEwDesc(""); showToast("Extra work added"); setView("dashboard");
  }

  function toggleExtraWork(ewId) {
    setExtraWork(function(prev) {
      return prev.filter(function(e) {
        if (e.id === ewId) {

            return false;

        return true;

  function handleImportFile(e) {

    var reader = new FileReader();

        setModal({
          title: "Import Data?", titleColor: C.orange,
          message: "This will replace your current data with the imported file.",
          buttons: [
            { label: "↻ Replace with import", bg: C.orangeDim, borderColor: C.orange + "33", color: C.orange, onClick: function() {
              setChains(data.chains || []); setExtraWork(data.extraWork || []); setModal(null); showToast("Imported");
            }},
            { label: "Cancel", bg: C.card, borderColor: C.border, color: C.soft, onClick: function() { setModal(null); } }
          ]
        });
      } catch (err) { showToast("Error reading file"); }
    };
    reader.readAsText(file);
  }

      // Progress bar

        React.createElement("div", { style: { fontSize: 14, fontWeight: 700 } }, getMonthLabel(currentMK)),
        React.createElement("div", { style: { fontSize: 13, fontWeight: 700, color: stats.pct === 100 ? C.green : C.cyan, fontFamily: "'IBM Plex Mono',monospace" } }, stats.pct + "%")

        React.createElement("div", { style: { fontSize: 11, color: C.soft, fontFamily: "'IBM Plex Mono',monospace" } },
          React.createElement("span", { style: { color: C.yellow } }, "● "), stats.remaining + " left"),
        React.createElement("div", { style: { fontSize: 11, color: C.soft, fontFamily: "'IBM Plex Mono',monospace" } },

          onClick: exportAll
